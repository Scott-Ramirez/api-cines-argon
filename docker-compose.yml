version: '3.8'

services:
  # ─── API REST NESTJS ────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cines_argon_api
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DB_HOST=${DB_HOST:-mysql_db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USERNAME=${DB_USERNAME:-argon_user}
      - DB_PASSWORD=${DB_PASSWORD:-argon_password_2026}
      - DB_DATABASE=${DB_DATABASE:-cines_argon}
    depends_on:
      - mysql_db
    networks:
      - cines_network

  # ─── BASE DE DATOS MYSQL 8.0 ────────────────────────────────────────────────
  mysql_db:
    image: mysql:8.0
    container_name: cines_argon_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD:-root_password_2026}}
      MYSQL_DATABASE: ${DB_DATABASE:-cines_argon}
      MYSQL_USER: ${DB_USERNAME:-argon_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-argon_password_2026}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cines_network

networks:
  cines_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
